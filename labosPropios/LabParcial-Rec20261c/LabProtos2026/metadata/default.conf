server {
    listen 80 default_server;
    server_name metadata.protos.foo;

    location / {
        # Sin el header "Metadata: true" -> 403 (como una nube real anti-SSRF)
        if ($http_metadata != "true") { return 403; }

        default_type application/json;
        return 200 '{"hola": "mundo", "vmName": "who_cares", "credentials": "superdupersecrettoken"}';
    }
}
