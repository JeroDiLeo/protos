# Cualquier Host que no sea parcial.protos.foo cae aca
server {
    listen 80 default_server;
    server_name _;
    default_type text/plain;
    return 200 "What?\n";
}
server {
    listen 80;
    server_name parcial.protos.foo;
    default_type text/plain;
    return 200 "Contenido servido por parcial.protos.foo via HTTP inseguro. Este es el backend que luego vamos a exponer por HTTPS usando seguro.protos.foo.\n";
}
