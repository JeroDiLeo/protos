server {
    listen 80;
    server_name google.com;
    root /var/www;
    index index.html;
    location / {
        try_files $uri $uri/ =404;
    }
    # MISCONFIG: /sec/ con listing de directorio activado -> se ve la clave Y una pista
    location /sec/ {
        autoindex on;
    }
}

server {
    listen 81;
    server_name secrethost;
    location / {
        proxy_pass http://127.0.0.1:8080/;
        proxy_set_header Host $host;
    }
}
